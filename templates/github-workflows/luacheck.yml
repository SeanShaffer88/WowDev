# Lint all Lua with luacheck on every push and pull request.
# Copy to .github/workflows/luacheck.yml in your addon repo, and the
# .luacheckrc from tools/ to your repo root (adjust paths to match).
name: Luacheck

on:
  push:
  pull_request:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck

      - name: Run luacheck
        run: luacheck .
